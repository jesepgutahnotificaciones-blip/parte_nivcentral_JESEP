<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Gestión de Novedades - JESEP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --verde: #01592F;
      --verde-oscuro: #013d21;
      --gris: #f4f6f7;
      --gris-borde: #dfe4e7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--gris); font-family: Arial, Helvetica, sans-serif; color: #263238; }
    .app-header { background: var(--verde); color: white; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .app-header h3 { margin: 0; font-weight: 700; }
    .container-app { max-width: 1500px; margin: auto; padding: 20px; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 20px; }
    .card-header { background: white; border-bottom: 1px solid var(--gris-borde); font-weight: 700; padding: 15px 18px; }
    .card-body { padding: 18px; }
    .btn-pol { background: var(--verde); color: white; border: none; }
    .btn-pol:hover { background: var(--verde-oscuro); color: white; }
    .section { display: none; }
    .section.active { display: block; }
    .menu { background: white; border-radius: 10px; padding: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .menu button { border: none; background: transparent; padding: 10px 14px; border-radius: 7px; margin: 2px; color: #455a64; font-weight: 600; cursor: pointer; }
    .menu button:hover { background: #eef3f1; }
    .menu button.active { background: var(--verde); color: white; }
    .turn-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .turn-button { border: 1px solid var(--gris-borde); background: white; border-radius: 12px; padding: 18px 12px; cursor: pointer; transition: .2s; }
    .turn-button:hover { transform: translateY(-2px); border-color: var(--verde); box-shadow: 0 4px 12px rgba(0,0,0,.10); }
    .turn-button strong { display: block; font-size: 30px; color: var(--verde); }
    .turn-button span { display: block; margin-top: 5px; font-size: 13px; color: #546e7a; }
    .employee-card { border-left: 5px solid var(--verde); background: #f8faf9; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
    .employee-name { font-size: 19px; font-weight: 700; color: var(--verde); }
    .employee-meta { color: #546e7a; font-size: 14px; margin-top: 5px; }
    .table-wrapper { overflow-x: auto; width: 100%; }
    table { width: 100%; font-size: 13px; background: white; }
    th { background: var(--verde) !important; color: white !important; white-space: nowrap; }
    td { vertical-align: middle; }
    .empty, .loading { padding: 25px; text-align: center; background: white; border-radius: 10px; }
    .toast-app { position: fixed; right: 20px; bottom: 20px; z-index: 9999; min-width: 280px; background: #263238; color: white; padding: 14px 18px; border-radius: 8px; display: none; }
    .toast-app.show { display: block; }
  </style>
</head>

<body>

<div id="aplicacion">
  <header class="app-header">
    <div class="container-app">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h3>POLICÍA NACIONAL</h3>
          <small>Sistema de Gestión de Novedades — Módulo Fuerza Disponible (JESEP / GUTAH)</small>
        </div>
      </div>
    </div>
  </header>

  <main class="container-app">
    <nav class="menu">
      <button type="button" id="menuConsulta" onclick="mostrarSeccion('consulta')" class="active">🔎 Consulta</button>
      <button type="button" id="menuNovedad" onclick="mostrarSeccion('novedad')">📝 Registrar novedad</button>
      <button type="button" id="menuTurnos" onclick="mostrarSeccion('turnos')">📋 Turnos y Fuerza Disponible</button>
      <button type="button" id="menuReportes" onclick="mostrarSeccion('reportes')">📄 Reportes</button>
    </nav>

    <section id="seccionConsulta" class="section active">
      <div class="card">
        <div class="card-header">🔎 Consulta de funcionario</div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-9">
              <input type="text" id="buscarValor" class="form-control" placeholder="Digite cédula, nombre, grado, nivel o dependencia" onkeydown="if(event.key === 'Enter'){ buscarFuncionario(); }">
            </div>
            <div class="col-md-3">
              <button type="button" class="btn btn-pol w-100" onclick="buscarFuncionario()">🔎 Buscar</button>
            </div>
          </div>
        </div>
      </div>
      <div id="resultadosBusqueda"></div>
    </section>

    <section id="seccionNovedad" class="section">
      <div class="card">
        <div class="card-header">📝 Registrar novedad</div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Funcionario</label>
              <input type="text" id="novedadFuncionario" class="form-control" readonly placeholder="Seleccione un funcionario mediante la consulta">
              <input type="hidden" id="novedadCedula">
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo de Novedad</label>
              <select id="tipoNovedad" class="form-select">
                <option value="SERVICIO">SERVICIO</option>
                <option value="PERMISO">PERMISO</option>
                <option value="OTRA NOVEDAD">OTRA NOVEDAD</option>
                <option value="EXCUSA MEDICA">EXCUSA MEDICA</option>
                <option value="PLAN VACACIONAL">PLAN VACACIONAL</option>
                <option value="CAMBIO DE TURNO">CAMBIO DE TURNO</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Detalle / Novedad</label>
              <input type="text" id="novedadNombre" class="form-control" placeholder="Nombre o detalle de la novedad">
            </div>
            <div class="col-md-6">
              <label class="form-label">Días</label>
              <input type="number" id="novedadDias" class="form-control" min="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha inicial</label>
              <input type="date" id="fechaInicial" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha presentación</label>
              <input type="date" id="fechaPresentacion" class="form-control">
            </div>
          </div>
          <div class="mt-3">
            <button type="button" class="btn btn-pol" onclick="registrarNovedad()">💾 Guardar novedad</button>
            <button type="button" class="btn btn-secondary" onclick="limpiarFormularioNovedad()">Limpiar</button>
          </div>
        </div>
      </div>
    </section>

    <section id="seccionTurnos" class="section">
      <div class="card">
        <div class="card-header">📋 Conteo y Listado por Turno / Fuerza Disponible</div>
        <div class="card-body">
          <p class="text-muted">Seleccione el turno para consultar el listado y el conteo de la fuerza disponible.</p>
          <div class="turn-buttons">
            <button type="button" class="turn-button" onclick="cargarTurno('A')"><strong>A</strong><span>Turno A</span></button>
            <button type="button" class="turn-button" onclick="cargarTurno('B')"><strong>B</strong><span>Turno B</span></button>
            <button type="button" class="turn-button" onclick="cargarTurno('C')"><strong>C</strong><span>Turno C</span></button>
          </div>
        </div>
      </div>
      <div id="resultadoTurno"></div>
    </section>

    <section id="seccionReportes" class="section">
      <div class="card">
        <div class="card-header">📄 Reportes de Novedades</div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Turno</label>
              <select id="filtroReporte" class="form-select">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
              </select>
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <button type="button" class="btn btn-pol" onclick="previsualizarReporte()">👁 Previsualizar</button>
            </div>
          </div>
        </div>
      </div>
      <div id="resultadoReporte"></div>
    </section>
  </main>
</div>

<div id="toastApp" class="toast-app"></div>

<script>
const APPS_SCRIPT_API_URL = 'https://script.google.com/macros/s/AKfycbwYX4oYPTLOkasXsAMoEMeSMoFYCpYHTmBe39odD5KbOvC6XTKIyfGbqqJl0ahzSQuT/exec';
const TOKEN_FIJO = 'LIBRE';

(function configurarPuenteAPI() {
  const TIMEOUT_MS = 90000;
  function llamarAPI_(accion, argumentos, alExito, alFallar) {
    const nombreCallback = '__cb_' + accion + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    let finalizado = false;
    function limpiar() {
      delete window[nombreCallback];
      if (elementoScript.parentNode) elementoScript.parentNode.removeChild(elementoScript);
      clearTimeout(idTimeout);
    }
    window[nombreCallback] = function(respuesta) {
      if (finalizado) return;
      finalizado = true;
      limpiar();
      if (respuesta && respuesta.__jsonp_error === true) {
        if (alFallar) alFallar({ message: respuesta.mensaje || 'Error en el servidor.' });
        return;
      }
      if (alExito) alExito(respuesta);
    };
    const idTimeout = setTimeout(function() {
      if (finalizado) return;
      finalizado = true;
      limpiar();
      if (alFallar) alFallar({ message: 'Tiempo de espera agotado.' });
    }, TIMEOUT_MS);

    const parametros = new URLSearchParams();
    parametros.set('accion', accion);
    parametros.set('callback', nombreCallback);
    try {
      parametros.set('args', JSON.stringify(argumentos || []));
    } catch (e) {
      finalizado = true;
      clearTimeout(idTimeout);
      if (alFallar) alFallar({ message: 'Error al preparar solicitud.' });
      return;
    }

    const elementoScript = document.createElement('script');
    elementoScript.src = APPS_SCRIPT_API_URL + '?' + parametros.toString();
    elementoScript.onerror = function() {
      if (finalizado) return;
      finalizado = true;
      limpiar();
      if (alFallar) alFallar({ message: 'No se pudo contactar el servidor.' });
    };
    document.head.appendChild(elementoScript);
  }

  function crearEjecutor_() {
    let manejadorExito = null;
    let manejadorFallo = null;
    const base = {
      withSuccessHandler: function(fn) { manejadorExito = fn; return proxyEjecutor; },
      withFailureHandler: function(fn) { manejadorFallo = fn; return proxyEjecutor; },
      withUserObject: function() { return proxyEjecutor; }
    };
    return new Proxy(base, {
      get: function(objetivo, propiedad) {
        if (propiedad in objetivo) return objetivo[propiedad];
        return function() {
          const argumentos = Array.prototype.slice.call(arguments);
          llamarAPI_(propiedad, argumentos, manejadorExito, manejadorFallo);
        };
      }
    });
  }

  window.google = window.google || {};
  window.google.script = window.google.script || {};
  Object.defineProperty(window.google.script, 'run', { get: crearEjecutor_, configurable: true });
})();

let funcionarioSeleccionado = null;

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function mostrarToast(mensaje, tipo = 'success') {
  const toast = document.getElementById('toastApp');
  toast.textContent = mensaje || '';
  toast.style.background = tipo === 'error' ? '#b71c1c' : '#263238';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

function mostrarSeccion(nombre) {
  const mapa = { consulta: 'seccionConsulta', novedad: 'seccionNovedad', turnos: 'seccionTurnos', reportes: 'seccionReportes' };
  const botones = { consulta: 'menuConsulta', novedad: 'menuNovedad', turnos: 'menuTurnos', reportes: 'menuReportes' };

  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));

  const seccion = document.getElementById(mapa[nombre]);
  if (seccion) seccion.classList.add('active');
  const boton = document.getElementById(botones[nombre]);
  if (boton) boton.classList.add('active');
}

function buscarFuncionario() {
  const valor = document.getElementById('buscarValor').value.trim();
  const contenedor = document.getElementById('resultadosBusqueda');
  if (!valor) {
    contenedor.innerHTML = '<div class="empty">Ingrese cédula, nombre, grado, nivel o dependencia.</div>';
    return;
  }
  contenedor.innerHTML = '<div class="loading">🔄 Buscando funcionario...</div>';

  google.script.run
    .withSuccessHandler(respuesta => {
      if (!respuesta || respuesta.estado !== true) {
        contenedor.innerHTML = '<div class="empty">No se encontraron funcionarios.</div>';
        return;
      }
      const datos = respuesta.datos || [];
      if (!datos.length) {
        contenedor.innerHTML = '<div class="empty">No se encontraron funcionarios.</div>';
        return;
      }
      let html = '<div class="card"><div class="card-header">Funcionarios encontrados</div><div class="card-body">';
      datos.forEach(f => {
        html += '<div class="employee-card">' +
          '<div class="employee-name">' + esc(f.funcionario) + '</div>' +
          '<div class="employee-meta">CC: ' + esc(f.cedula) + ' | GR: ' + esc(f.grado) + ' | Dependencia: ' + esc(f.dependencia) + ' | Turno: ' + esc(f.turno) + '</div>' +
          '<div class="mt-2"><button type="button" class="btn btn-sm btn-pol" onclick=\'seleccionarFuncionario(' + JSON.stringify(f) + ')\'>Seleccionar</button></div>' +
          '</div>';
      });
      html += '</div></div>';
      contenedor.innerHTML = html;
    })
    .withFailureHandler(() => {
      contenedor.innerHTML = '<div class="alert alert-danger">Error al consultar funcionarios.</div>';
    })
    .buscarFuncionario(TOKEN_FIJO, valor);
}

function seleccionarFuncionario(f) {
  funcionarioSeleccionado = f;
  document.getElementById('novedadCedula').value = f.cedula;
  document.getElementById('novedadFuncionario').value = f.funcionario;
  mostrarSeccion('novedad');
  mostrarToast('Funcionario seleccionado.');
}

function registrarNovedad() {
  if (!funcionarioSeleccionado) {
    mostrarToast('Debe seleccionar primero un funcionario.', 'error');
    return;
  }
  const novedad = document.getElementById('novedadNombre').value.trim();
  if (!novedad) {
    mostrarToast('Ingrese el detalle de la novedad.', 'error');
    return;
  }

  const datos = {
    cc: funcionarioSeleccionado.cedula,
    novedad: document.getElementById('tipoNovedad').value,
    descripcion: novedad,
    dias: document.getElementById('novedadDias').value,
    fechaInicial: document.getElementById('fechaInicial').value,
    fechaPresentacion: document.getElementById('fechaPresentacion').value
  };

  google.script.run
    .withSuccessHandler(respuesta => {
      if (respuesta && respuesta.estado === true) {
        mostrarToast(respuesta.mensaje || 'Novedad registrada correctamente.');
        limpiarFormularioNovedad();
      } else {
        mostrarToast(respuesta.mensaje || 'No fue posible registrar la novedad.', 'error');
      }
    })
    .withFailureHandler(() => {
      mostrarToast('Error registrando novedad.', 'error');
    })
    .registrarNovedad(TOKEN_FIJO, datos);
}

function limpiarFormularioNovedad() {
  document.getElementById('novedadNombre').value = '';
  document.getElementById('novedadDias').value = '';
  document.getElementById('fechaInicial').value = '';
  document.getElementById('fechaPresentacion').value = '';
  funcionarioSeleccionado = null;
  document.getElementById('novedadFuncionario').value = '';
}

function cargarTurno(filtro) {
  const contenedor = document.getElementById('resultadoTurno');
  contenedor.innerHTML = '<div class="loading">🔄 Cargando fuerza disponible para el turno ' + esc(filtro) + '...</div>';

  google.script.run
    .withSuccessHandler(respuesta => {
      if (!respuesta || respuesta.estado !== true) {
        contenedor.innerHTML = '<div class="card"><div class="card-header">Turno ' + esc(filtro) + '</div><div class="card-body"><div class="empty">No se encontraron registros.</div></div></div>';
        return;
      }
      const datos = respuesta.datos || [];
      let html = '<div class="card"><div class="card-header">Fuerza Disponible - Turno ' + esc(filtro) + ' (' + datos.length + ' registros)</div><div class="card-body">';
      if (datos.length === 0) {
        html += '<div class="empty">No hay personal registrado en este turno.</div>';
      } else {
        html += '<div class="table-wrapper"><table class="table table-striped table-bordered"><thead><tr><th>Grado</th><th>Funcionario</th><th>Cédula</th><th>Dependencia</th></tr></thead><tbody>';
        datos.forEach(d => {
          html += '<tr><td>' + esc(d.grado) + '</td><td>' + esc(d.funcionario) + '</td><td>' + esc(d.cedula) + '</td><td>' + esc(d.dependencia) + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</div></div>';
      contenedor.innerHTML = html;
    })
    .withFailureHandler(error => {
      contenedor.innerHTML = '<div class="alert alert-danger">Error al consultar el turno: ' + esc(error.message) + '</div>';
    })
    .consultarPorTurno(TOKEN_FIJO, filtro);
}

function previsualizarReporte() {
  const filtro = document.getElementById('filtroReporte').value;
  const contenedor = document.getElementById('resultadoReporte');
  contenedor.innerHTML = '<div class="loading">🔄 Generando previsualización...</div>';

  google.script.run
    .withSuccessHandler(respuesta => {
      if (respuesta && respuesta.estado) {
        contenedor.innerHTML = '<div class="card"><div class="card-body">' + respuesta.html + '</div></div>';
      } else {
        contenedor.innerHTML = '<div class="empty">No hay datos para previsualizar.</div>';
      }
    })
    .withFailureHandler(() => {
      contenedor.innerHTML = '<div class="alert alert-danger">Error al generar reporte.</div>';
    })
    .previsualizarSoloNovedades(TOKEN_FIJO, filtro);
}
</script>

</body>
</html>
