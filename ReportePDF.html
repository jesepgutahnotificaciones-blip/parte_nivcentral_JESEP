<!DOCTYPE html>

<html>


<head>


<style>


body{

font-family:Arial;
font-size:11px;

}



.encabezado{


text-align:center;

border-bottom:
2px solid #000;


}



.titulo{


font-size:18px;

font-weight:bold;


}



.subtitulo{


font-size:14px;


}



table{


width:100%;

border-collapse:collapse;


}



th{


background:#01592F;

color:white;

padding:5px;


}



td{


border:1px solid #777;

padding:5px;


}



.pie{


margin-top:50px;

text-align:center;


}



.numero{


text-align:right;

font-size:10px;


}



</style>



</head>


<body>




<div class="encabezado">



<div class="titulo">

POLICÍA NACIONAL

</div>


<div class="subtitulo">

SISTEMA DE GESTIÓN DE NOVEDADES

</div>


<br>


<b>
REPORTE CONSOLIDADO POR TURNO
</b>



<br><br>



Turno:

<?= turno ?>


<br>


Fecha:

<?= fecha ?>



</div>




<br>




<div class="numero">

Reporte No:
<?= consecutivo ?>

</div>




<h4>

Resumen

</h4>


<table>


<tr>


<th>
Total funcionarios
</th>


<th>
Total novedades
</th>


</tr>


<tr>


<td>

<?= funcionarios ?>

</td>


<td>

<?= novedades ?>

</td>


</tr>


</table>





<br>



<table>



<tr>


<th>

CEDULA

</th>


<th>

GR

</th>



<th>

FUNCIONARIO

</th>



<th>

DEPENDENCIA

</th>



<th>

TURNO

</th>



<th>

HISTORIAL

</th>


</tr>





<? datos.forEach(function(d){ ?>


<tr>


<td>

<?= d.cedula ?>

</td>


<td>

<?= d.grado ?>

</td>


<td>

<?= d.funcionario ?>

</td>



<td>

<?= d.dependencia ?>

</td>



<td>

<?= d.turno ?>

</td>




<td>


<? d.historial.forEach(function(n){ ?>


<?= n.FECHA_REGISTRO ?>

<br>


<b>
<?= n.TIPO ?>
</b>


<br>


<?= n.NOVEDAD ?>


<hr>


<? }); ?>


</td>



</tr>


<? }); ?>



</table>






<div class="pie">


<br><br>



______________________________


<br>


Responsable elaboración reporte


<br><br>


POLICÍA NACIONAL


</div>





</body>


</html>
