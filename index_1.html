<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Gestión de Novedades - JESEP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --verde: #01592F;
      --verde-oscuro: #013d21;
      --azul: #173E56;
      --dorado: #C9A227;
      --gris: #f4f6f7;
      --gris-borde: #dfe4e7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--gris);
      font-family: Arial, Helvetica, sans-serif;
      color: #263238;
    }

    .app-header {
      background: var(--verde);
      color: white;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .app-header h3 { margin: 0; font-weight: 700; }
    .app-header small { opacity: .9; }

    .container-app { max-width: 1500px; margin: auto; padding: 20px; }

    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .card-header {
      background: white;
      border-bottom: 1px solid var(--gris-borde);
      font-weight: 700;
      padding: 15px 18px;
    }

    .card-body { padding: 18px; }

    .btn-pol { background: var(--verde); color: white; border: none; }
    .btn-pol:hover { background: var(--verde-oscuro); color: white; }

    .btn-dorado { background: var(--dorado); color: white; border: none; }
    .btn-dorado:hover { opacity: .9; color: white; }

    .section { display: none; }
    .section.active { display: block; }

    .menu {
      background: white;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .menu button {
      border: none;
      background: transparent;
      padding: 10px 14px;
      border-radius: 7px;
      margin: 2px;
      color: #455a64;
      font-weight: 600;
    }

    .menu button:hover { background: #eef3f1; }
    .menu button.active { background: var(--verde); color: white; }

    .turn-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .turn-button {
      border: 1px solid var(--gris-borde);
      background: white;
      border-radius: 12px;
      padding: 18px 12px;
      cursor: pointer;
      transition: .2s;
    }

    .turn-button:hover {
      transform: translateY(-2px);
      border-color: var(--verde);
      box-shadow: 0 4px 12px rgba(0,0,0,.10);
    }

    .turn-button strong { display: block; font-size: 30px; color: var(--verde); }
    .turn-button span { display: block; margin-top: 5px; font-size: 13px; color: #546e7a; }

    .employee-card {
      border-left: 5px solid var(--verde);
      background: #f8faf9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .employee-name { font-size: 19px; font-weight: 700; color: var(--verde); }
    .employee-meta { color: #546e7a; font-size: 14px; margin-top: 5px; }

    .table-wrapper { overflow-x: auto; width: 100%; }
    table { width: 100%; font-size: 13px; background: white; }
    th { background: var(--verde) !important; color: white !important; white-space: nowrap; }
    td { vertical-align: middle; }

    .badge-novedad {
      background: #e8f3ed;
      color: var(--verde);
      border: 1px solid #c8dfd2;
      padding: 4px 7px;
      border-radius: 5px;
      display: inline-block;
      margin: 2px;
      font-size: 11px;
    }

    .empty { padding: 25px; text-align: center; color: #78909c; background: white; border-radius: 10px; }
    .loading { padding: 25px; text-align: center; background: white; border-radius: 10px; color: var(--verde); }

    .stat-card {
      border-radius: 10px;
      padding: 15px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      height: 100%;
      border-top: 4px solid var(--verde);
    }

    .stat-number { font-size: 24px; font-weight: 700; color: var(--verde); }
    .stat-label { color: #607d8b; font-size: 12px; font-weight: 600; text-transform: uppercase; }

    .toast-app {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      min-width: 280px;
      max-width: 420px;
      background: #263238;
      color: white;
      padding: 14px 18px;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
      display: none;
    }

    .toast-app.show { display: block; }
    .report-frame { width: 100%; min-height: 600px; border: 1px solid var(--gris-borde); border-radius: 8px; background: white; }

    .hidden { display: none !important; }

    @media print {
      body { background: white; }
      .no-print, .menu, .app-header, button, input, select, textarea { display: none !important; }
      .section { display: none !important; }
      #seccionTurnos { display: block !important; }
      #resultadoTurno { display: block !important; }
      .card { box-shadow: none; border: none; }
      table { font-size: 10px; }
      th { background: #01592F !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>

<body>

  <!-- APLICACIÓN -->
  <div id="aplicacion" class="hidden">

    <header class="app-header">
      <div class="container-app">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h3>POLICÍA NACIONAL</h3>
            <small>Sistema de Gestión de Novedades — JESEP / GUTAH</small>
          </div>
          <div class="text-end">
            <div id="usuarioActual"><strong>—</strong><br><small>—</small></div>
            <button type="button" class="btn btn-sm btn-outline-light mt-2" onclick="cerrarSesion()">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container-app">

      <!-- MENÚ -->
      <nav class="menu no-print">
        <button type="button" id="menuConsulta" onclick="mostrarSeccion('consulta')">🔎 Consulta</button>
        <button type="button" id="menuNovedad" onclick="mostrarSeccion('novedad')">📝 Registrar novedad</button>
        <button type="button" id="menuTurnos" onclick="mostrarSeccion('turnos')">📋 Turnos</button>
        <button type="button" id="menuReportes" onclick="mostrarSeccion('reportes')">📄 Reportes</button>
        <button type="button" id="menuUsuarios" class="soloAdministrador hidden" onclick="mostrarSeccion('usuarios')">👤 Usuarios</button>
      </nav>

      <!-- CONSULTA FUNCIONARIO -->
      <section id="seccionConsulta" class="section active">
        <div class="card">
          <div class="card-header">🔎 Consulta de funcionario</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-9">
                <input type="text" id="buscarValor" class="form-control" placeholder="Digite cédula, nombre, grado, nivel o dependencia" onkeydown="if(event.key === 'Enter'){ buscarFuncionario(); }">
              </div>
              <div class="col-md-3">
                <button type="button" class="btn btn-pol w-100" onclick="buscarFuncionario()">🔎 Buscar</button>
              </div>
            </div>
          </div>
        </div>
        <div id="resultadosBusqueda"></div>
        <div id="fichaFuncionario"></div>
        <div id="historialFuncionario"></div>
      </section>

      <!-- REGISTRAR NOVEDAD -->
      <section id="seccionNovedad" class="section">
        <div class="card">
          <div class="card-header">📝 Registrar novedad</div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label">Funcionario</label>
                <input type="text" id="novedadFuncionario" class="form-control" readonly placeholder="Seleccione un funcionario mediante la consulta">
                <input type="hidden" id="novedadCedula">
              </div>
              <div class="col-md-4">
                <label class="form-label">Tipo</label>
                <select id="tipoNovedad" class="form-select">
                  <option value="SERVICIO">SERVICIO</option>
                  <option value="VACACIONES">VACACIONES</option>
                  <option value="PERMISO">PERMISO</option>
                  <option value="CITA MEDICA">CITA MEDICA</option>
                  <option value="LICENCIA">LICENCIA</option>
                  <option value="OTRA NOVEDAD">OTRA NOVEDAD</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Novedad</label>
                <input type="text" id="novedadNombre" class="form-control" placeholder="Nombre de la novedad">
              </div>
              <div class="col-md-6">
                <label class="form-label">Días</label>
                <input type="number" id="novedadDias" class="form-control" min="0">
              </div>
              <div class="col-md-6">
                <label class="form-label">Fecha inicial</label>
                <input type="date" id="fechaInicial" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Fecha presentación</label>
                <input type="date" id="fechaPresentacion" class="form-control">
              </div>
              <div class="col-md-12">
                <label class="form-label">Descripción</label>
                <textarea id="descripcionNovedad" class="form-control" rows="2" placeholder="Descripción de la novedad"></textarea>
              </div>
              <div class="col-md-12">
                <label class="form-label">Observación</label>
                <textarea id="observacionNovedad" class="form-control" rows="3" placeholder="Observación"></textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label">RV</label>
                <input type="text" id="rvNovedad" class="form-control">
              </div>
            </div>
            <div class="mt-3">
              <button type="button" class="btn btn-pol" onclick="registrarNovedad()">💾 Guardar novedad</button>
              <button type="button" class="btn btn-secondary" onclick="limpiarFormularioNovedad()">Limpiar</button>
            </div>
          </div>
        </div>
      </section>

      <!-- TURNOS -->
      <section id="seccionTurnos" class="section">
        <div class="card">
          <div class="card-header">📋 Listado completo por turno</div>
          <div class="card-body">
            <p class="text-muted">Seleccione el grupo que desea consultar.</p>
            <div class="turn-buttons" id="contenedorTurnos">
              <!-- Los botones se generan dinámicamente según permisos -->
            </div>
          </div>
        </div>
        <div id="resultadoTurno"></div>
      </section>

      <!-- REPORTES -->
      <section id="seccionReportes" class="section">
        <div class="card">
          <div class="card-header">📄 Reportes</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label">Turno</label>
                <select id="filtroReporte" class="form-select">
                  <option value="A">A</option>
                  <option value="B">B</option>
                  <option value="C">C</option>
                  <option value="SEPRI">SEPRI</option>
                  <option value="GURIN">GURIN</option>
                  <option value="NO APLICA">NO APLICA</option>
                </select>
              </div>
              <div class="col-md-6 d-flex align-items-end gap-2">
                <button type="button" class="btn btn-pol" onclick="previsualizarReporte()">👁 Previsualizar</button>
                <button type="button" class="btn btn-secondary" onclick="imprimirReporte()">🖨 Imprimir</button>
                <button type="button" id="btnGenerarPDF" class="btn btn-danger" onclick="generarArchivoReporte('pdf')">📄 Generar PDF</button>
                <button type="button" id="btnGenerarExcel" class="btn btn-success" onclick="generarArchivoReporte('excel')">📊 Generar Excel</button>
                <button type="button" class="btn btn-outline-secondary" onclick="probarDescarga()">🔧 Probar descarga</button>
              </div>
            </div>
          </div>
        </div>
        <div id="resultadoReporte"></div>
        <div id="ultimoArchivo"></div>
        <div class="card">
          <div class="card-header">Historial de reportes</div>
          <div class="card-body">
            <button type="button" class="btn btn-pol mb-3" onclick="cargarReportes()">🔄 Actualizar</button>
            <div id="listaReportes"></div>
          </div>
        </div>
      </section>

      <!-- USUARIOS (SOLO ADMIN) -->
      <section id="seccionUsuarios" class="section soloAdministrador">
        <div class="card">
          <div class="card-header">👤 Administración de usuarios</div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-3"><label class="form-label">Usuario</label><input type="text" id="nuevoUsuario" class="form-control"></div>
              <div class="col-md-3"><label class="form-label">Contraseña</label><input type="password" id="nuevaClave" class="form-control"></div>
              <div class="col-md-3"><label class="form-label">Rol</label><select id="nuevoRol" class="form-select"><option value="OPERADOR">OPERADOR</option><option value="ADMINISTRADOR">ADMINISTRADOR</option></select></div>
              <div class="col-md-3"><label class="form-label">Dependencia</label><input type="text" id="nuevaDependencia" class="form-control" placeholder="Ej. NIVEL_CENTRAL"></div>
            </div>
            <button type="button" class="btn btn-pol mt-3" onclick="crearUsuario()">➕ Crear usuario</button>
          </div>
        </div>
        <div id="listaUsuarios"></div>
      </section>

    </main>
  </div>

  <!-- TOAST -->
  <div id="toastApp" class="toast-app"></div>

  <!-- JAVASCRIPT -->
  <script>
  const APPS_SCRIPT_API_URL = 'https://script.google.com/macros/s/AKfycbz_p2WRIL9gDHQk5Ar_zVZoqw68M3GmwBL_xDsWvnY2RwvI7-Tc05GW2UuvCHDkP-g/exec';
  const CLAVE_SESION = 'jesep_sesion';
  

  (function configurarPuenteAPI() {
    const TIMEOUT_MS = 90000;
    function llamarAPI_(accion, argumentos, alExito, alFallar) {
      const nombreCallback = '__cb_' + accion.replace(/[^a-zA-Z0-9_]/g, '') + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
      let finalizado = false;

      function limpiar() {
        delete window[nombreCallback];
        if (elementoScript.parentNode) elementoScript.parentNode.removeChild(elementoScript);
        clearTimeout(idTimeout);
      }

      window[nombreCallback] = function(respuesta) {
        if (finalizado) return;
        finalizado = true;
        limpiar();
        if (respuesta && respuesta.__jsonp_error === true) {
          if (alFallar) alFallar({ message: respuesta.mensaje || 'Se presentó un error en el servidor.' });
          return;
        }
        if (alExito) alExito(respuesta);
      };

      const idTimeout = setTimeout(function() {
        if (finalizado) return;
        finalizado = true;
        limpiar();
        if (alFallar) alFallar({ message: 'Tiempo de espera agotado contactando el servidor.' });
      }, TIMEOUT_MS);

      const parametros = new URLSearchParams();
      parametros.set('accion', accion);
      parametros.set('callback', nombreCallback);
      try {
        parametros.set('args', JSON.stringify(argumentos || []));
      } catch (e) {
        finalizado = true;
        clearTimeout(idTimeout);
        if (alFallar) alFallar({ message: 'No fue posible preparar la solicitud.' });
        return;
      }

      const elementoScript = document.createElement('script');
      elementoScript.src = APPS_SCRIPT_API_URL + '?' + parametros.toString();
      elementoScript.onerror = function() {
        if (finalizado) return;
        finalizado = true;
        limpiar();
        if (alFallar) alFallar({ message: 'No se pudo contactar el servidor.' });
      };
      document.head.appendChild(elementoScript);
    }

    function crearEjecutor_() {
      let manejadorExito = null;
      let manejadorFallo = null;
      const base = {
        withSuccessHandler: function(fn) { manejadorExito = fn; return proxyEjecutor; },
        withFailureHandler: function(fn) { manejadorFallo = fn; return proxyEjecutor; },
        withUserObject: function() { return proxyEjecutor; }
      };
      const proxyEjecutor = new Proxy(base, {
        get: function(objetivo, propiedad) {
          if (propiedad in objetivo) return objetivo[propiedad];
          return function() {
            const argumentos = Array.prototype.slice.call(arguments);
            llamarAPI_(propiedad, argumentos, manejadorExito, manejadorFallo);
          };
        }
      });
      return proxyEjecutor;
    }

    window.google = window.google || {};
    window.google.script = window.google.script || {};
    Object.defineProperty(window.google.script, 'run', { get: crearEjecutor_, configurable: true });
  })();

  /* VARIABLES GLOBALES */
  let tokenSesion = null;
  let usuarioSesion = null;
  let rolSesion = null;
  let dependenciaSesion = '';
  let turnoPermitido = '';
  let funcionarioSeleccionado = null;
  let ultimoTurnoConsultado = null;
  let ultimoResultadoturno = null;
  let ultimoReporteArchivos = null;

  document.addEventListener('DOMContentLoaded', function() {
    // Leer sesión guardada por index.html
    const sesionGuardada = leerSesion();
    if (sesionGuardada && sesionGuardada.token) {
      tokenSesion = sesionGuardada.token;
      usuarioSesion = sesionGuardada.usuario ? sesionGuardada.usuario.usuario : null;
      rolSesion = sesionGuardada.usuario ? sesionGuardada.usuario.rol : null;
      dependenciaSesion = sesionGuardada.usuario ? (sesionGuardada.usuario.dependencia || '') : '';
      turnoPermitido = sesionGuardada.usuario ? (sesionGuardada.usuario.turnoPermitido || '') : '';

      if (!usuarioSesion) {
        // Redirigir al login si no hay sesión válida
        window.location.href = 'index.html';
        return;
      }

      mostrarAplicacion();
    } else {
      // No hay sesión, redirigir al login
      window.location.href = 'index.html';
    }
  });

  function leerSesion() {
    try { return JSON.parse(sessionStorage.getItem(CLAVE_SESION) || 'null'); } catch (e) { return null; }
  }

  function mostrarAplicacion() {
    document.getElementById('aplicacion').classList.remove('hidden');

    // Actualizar info de usuario
    const infoUsuario = document.getElementById('usuarioActual');
    infoUsuario.innerHTML = '<strong>' + esc(usuarioSesion) + '</strong><br><small>' + esc(rolSesion) + (dependenciaSesion ? ' — ' + esc(dependenciaSesion) : '') + '</small>';

    configurarPermisos();
    mostrarSeccion('consulta');
  }

  function cerrarSesion() {
    try { sessionStorage.removeItem(CLAVE_SESION); } catch (e) {}
    window.location.href = 'index.html';
  }

  // Descarga el archivo directamente desde Apps Script.
  // El servidor responde con Content-Disposition: attachment, asi que el
  // navegador guarda el archivo sin pasar por Drive ni por base64.
  function urlReporte_(formato, filtro) {
    return APPS_SCRIPT_API_URL +
      '?accion=descargarReporte' +
      '&formato=' + encodeURIComponent(formato) +
      '&filtro=' + encodeURIComponent(filtro) +
      '&_=' + Date.now();
  }

  function descargarReporte_(formato, filtro) {
    const url = urlReporte_(formato, filtro);

    // 1) Enlace visible: si el navegador no dispara la descarga solo,
    //    el usuario puede pulsarlo manualmente.
    mostrarEnlaceDescarga_(formato, filtro, url);

    // 2) Intento automatico en un iframe oculto (no abre pestana).
    const marco = document.createElement('iframe');
    marco.style.display = 'none';
    marco.src = url;
    marco.onerror = function() { /* el enlace visible cubre el fallback */ };
    document.body.appendChild(marco);
    setTimeout(function() {
      try { document.body.removeChild(marco); } catch (e) {}
    }, 60000);
  }

  function mostrarEnlaceDescarga_(formato, filtro, url) {
    const caja = document.getElementById('ultimoArchivo');
    if (!caja) return;
    const ext = (formato === 'pdf') ? 'PDF' : 'Excel';
    caja.className = 'alert alert-info mt-3';
    caja.innerHTML =
      'Si la descarga no inició automáticamente, use este enlace: ' +
      '<a href="' + url + '" target="_blank" rel="noopener" class="alert-link">' +
      'Descargar ' + ext + ' del turno ' + esc(filtro) + '</a>';
  }

  function esc(valor) {
    if (valor === null || valor === undefined) return '';
    return String(valor).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function mostrarToast(mensaje, tipo = 'success') {
    const toast = document.getElementById('toastApp');
    toast.textContent = mensaje || '';
    toast.style.background = tipo === 'error' ? '#b71c1c' : '#263238';
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 3500);
  }

  function configurarPermisos() {
    // Sección Usuarios: solo ADMIN
    const esAdmin = rolSesion === 'ADMINISTRADOR';
    const menuUsuarios = document.getElementById('menuUsuarios');
    const seccionUsuarios = document.getElementById('seccionUsuarios');

    if (esAdmin) {
      menuUsuarios.classList.remove('hidden');
      seccionUsuarios.classList.remove('hidden');
    } else {
      menuUsuarios.classList.add('hidden');
      seccionUsuarios.classList.add('hidden');
    }

    // Botones de turno: según turnoPermitido
    const contenedorTurnos = document.getElementById('contenedorTurnos');
    const todosLosTurnos = [
      { valor: 'A', etiqueta: 'A', descripcion: 'Consultar Turno A' },
      { valor: 'B', etiqueta: 'B', descripcion: 'Consultar Turno B' },
      { valor: 'C', etiqueta: 'C', descripcion: 'Consultar Turno C' },
      { valor: 'SEPRI', etiqueta: 'SEPRI', descripcion: 'Todos los turnos SEPRI' },
      { valor: 'GURIN', etiqueta: 'GURIN', descripcion: 'Grupo GURIN' },
      { valor: 'NO APLICA', etiqueta: 'N/A', descripcion: 'NO APLICA' }
    ];

    let html = '';
    todosLosTurnos.forEach(function(t) {
      // Si tiene turnoPermitido, solo mostrar ese turno
      if (turnoPermitido && turnoPermitido !== 'TODOS' && t.valor !== turnoPermitido) {
        return;
      }
      html += '<button type="button" class="turn-button" onclick="cargarTurno(\'' + t.valor + '\')"><strong>' + t.etiqueta + '</strong><span>' + t.descripcion + '</span></button>';
    });
    contenedorTurnos.innerHTML = html;

    // Filtro de reportes: restringir también
    const filtroReporte = document.getElementById('filtroReporte');
    if (turnoPermitido && turnoPermitido !== 'TODOS') {
      filtroReporte.value = turnoPermitido;
      filtroReporte.disabled = true;
    } else {
      filtroReporte.disabled = false;
    }
  }

  function mostrarSeccion(nombre) {
    const mapa = { consulta: 'seccionConsulta', novedad: 'seccionNovedad', turnos: 'seccionTurnos', reportes: 'seccionReportes', usuarios: 'seccionUsuarios' };
    const botones = { consulta: 'menuConsulta', novedad: 'menuNovedad', turnos: 'menuTurnos', reportes: 'menuReportes', usuarios: 'menuUsuarios' };

    document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
    document.querySelectorAll('.menu button').forEach(function(b) { b.classList.remove('active'); });

    const seccion = document.getElementById(mapa[nombre]);
    if (seccion) seccion.classList.add('active');
    const boton = document.getElementById(botones[nombre]);
    if (boton) boton.classList.add('active');

    if (nombre === 'reportes') cargarReportes();
    if (nombre === 'usuarios') cargarUsuarios();
  }

  function buscarFuncionario() {
    const valor = document.getElementById('buscarValor').value.trim();
    const contenedor = document.getElementById('resultadosBusqueda');
    if (!valor) {
      contenedor.innerHTML = '<div class="empty">Ingrese cédula, nombre, grado, nivel o dependencia.</div>';
      return;
    }
    contenedor.innerHTML = '<div class="loading">🔄 Buscando funcionario...</div>';
    document.getElementById('fichaFuncionario').innerHTML = '';
    document.getElementById('historialFuncionario').innerHTML = '';

    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (!respuesta || respuesta.estado !== true) {
          contenedor.innerHTML = '<div class="empty">' + esc(respuesta && respuesta.mensaje ? respuesta.mensaje : 'No se encontraron funcionarios.') + '</div>';
          return;
        }
        const datos = respuesta.datos || [];
        if (!datos.length) {
          contenedor.innerHTML = '<div class="empty">No se encontraron funcionarios.</div>';
          return;
        }
        let html = '<div class="card"><div class="card-header">Funcionarios encontrados</div><div class="card-body">';
        datos.forEach(function(funcionario) {
          html += '<div class="employee-card">' +
            '<div class="employee-name">' + esc(funcionario.funcionario || funcionario.FUNCIONARIO || '') + '</div>' +
            '<div class="employee-meta">CC: ' + esc(funcionario.cedula || funcionario.CEDULA || '') + ' &nbsp; | &nbsp; GR: ' + esc(funcionario.grado || funcionario.GR || '') + ' &nbsp; | &nbsp; Turno: ' + esc(funcionario.turno || funcionario.TURNO || '') + '</div>' +
            '<div class="mt-2"><button type="button" class="btn btn-sm btn-pol me-1" onclick=\'seleccionarFuncionario(' + JSON.stringify(funcionario) + ')\'>Seleccionar</button></div>' +
            '</div>';
        });
        html += '</div></div>';
        contenedor.innerHTML = html;
      })
      .withFailureHandler(function(error) {
        contenedor.innerHTML = '<div class="alert alert-danger">' + esc(error && error.message ? error.message : 'Error al consultar.') + '</div>';
      })
      .buscarFuncionario(tokenSesion, valor);
  }

  function seleccionarFuncionario(funcionario) {
    funcionarioSeleccionado = funcionario;
    const cedula = funcionario.cedula || funcionario.CEDULA || '';
    document.getElementById('novedadCedula').value = cedula;
    document.getElementById('novedadFuncionario').value = funcionario.funcionario || funcionario.FUNCIONARIO || '';
    cargarFicha(cedula);
    mostrarSeccion('novedad');
    mostrarToast('Funcionario seleccionado.');
  }

  function cargarFicha(cedula) {
    const contenedor = document.getElementById('fichaFuncionario');
    contenedor.innerHTML = '<div class="loading">🔄 Cargando ficha...</div>';
    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (!respuesta || respuesta.estado !== true) {
          contenedor.innerHTML = '<div class="empty">No se pudo cargar la ficha.</div>';
          return;
        }
        const funcionario = respuesta.funcionario || respuesta.datos || {};
        let html = '<div class="card"><div class="card-header">Ficha del funcionario</div><div class="card-body">';
        html += '<div class="employee-card">' +
          '<div class="employee-name">' + esc(funcionario.funcionario || funcionario.FUNCIONARIO || '') + '</div>' +
          '<div class="employee-meta">Cédula: ' + esc(funcionario.cedula || funcionario.CEDULA || '') + ' | Grado: ' + esc(funcionario.grado || funcionario.GR || '') + ' | Turno: ' + esc(funcionario.turno || funcionario.TURNO || '') + '</div>' +
          '</div></div></div>';
        contenedor.innerHTML = html;
        cargarHistorial(cedula);
      })
      .withFailureHandler(function(error) {
        contenedor.innerHTML = '<div class="alert alert-danger">Error cargando ficha.</div>';
      })
      .obtenerFichaFuncionario(tokenSesion, cedula);
  }

  function cargarHistorial(cedula) {
    const contenedor = document.getElementById('historialFuncionario');
    contenedor.innerHTML = '<div class="loading">🔄 Consultando historial...</div>';
    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (!respuesta || respuesta.estado !== true) {
          contenedor.innerHTML = '<div class="empty">No fue posible consultar el historial.</div>';
          return;
        }
        const historial = respuesta.historial || respuesta.datos || [];
        if (!historial.length) {
          contenedor.innerHTML = '<div class="card"><div class="card-header">Historial de novedades</div><div class="card-body"><div class="empty">No registra novedades.</div></div></div>';
          return;
        }

        // Esquema fijo de NOVEDADES:
        // B(1)=cedula  E(4)=tipo  F(5)=novedad  G(6)=dias
        // H(7)=fecha inicial  I(8)=fecha presentacion
        const NOMBRES = ['CEDULA', '', '', '', 'TIPO', 'NOVEDAD', 'DIAS', 'FECHA INICIAL', 'FECHA PRESENTACION'];

        let html = '<div class="card"><div class="card-header">Historial de novedades</div><div class="card-body"><div class="table-wrapper"><table class="table table-bordered"><thead><tr><th>TIPO</th><th>NOVEDAD</th><th>DÍAS</th><th>FECHA INICIAL</th><th>FECHA PRESENTACIÓN</th></tr></thead><tbody>';
        historial.forEach(function(n) {
          const tipo = n['TIPO'] || NOMBRES[4] || '';
          const novedad = n['NOVEDAD'] || NOMBRES[5] || '';
          const dias = n['DIAS'] || NOMBRES[6] || '';
          const fIni = n['FECHA INICIAL'] || NOMBRES[7] || '';
          const fPre = n['FECHA PRESENTACION'] || NOMBRES[8] || '';
          html += '<tr><td><strong>' + esc(tipo) + '</strong></td>' +
            '<td><span class="badge-novedad">' + esc(novedad) + '</span></td>' +
            '<td>' + esc(dias) + '</td>' +
            '<td>' + esc(formatearValor(fIni)) + '</td>' +
            '<td>' + esc(formatearValor(fPre)) + '</td></tr>';
        });
        html += '</tbody></table></div></div></div>';
        contenedor.innerHTML = html;
      })
      .withFailureHandler(function(error) {
        contenedor.innerHTML = '<div class="alert alert-danger">Error consultando historial.</div>';
      })
      .obtenerHistorialFuncionario(tokenSesion, cedula);
  }

  function registrarNovedad() {
    if (!funcionarioSeleccionado) {
      mostrarToast('Debe seleccionar primero un funcionario.', 'error');
      return;
    }
    const cedula = funcionarioSeleccionado.cedula || funcionarioSeleccionado.CEDULA || document.getElementById('novedadCedula').value;
    const novedad = document.getElementById('novedadNombre').value.trim();
    if (!novedad) {
      mostrarToast('Ingrese la novedad.', 'error');
      return;
    }
    const datos = {
      cc: cedula, cedula: cedula, novedad: novedad,
      nombreFuncionario: funcionarioSeleccionado.funcionario || funcionarioSeleccionado.FUNCIONARIO ||
                         funcionarioSeleccionado.nombres || funcionarioSeleccionado.NOMBRES || '',
      tipo: document.getElementById('tipoNovedad').value,
      descripcion: document.getElementById('descripcionNovedad').value.trim(),
      dias: document.getElementById('novedadDias').value,
      fechaInicial: document.getElementById('fechaInicial').value,
      fechaPresentacion: document.getElementById('fechaPresentacion').value,
      observacion: document.getElementById('observacionNovedad').value.trim(),
      rv: document.getElementById('rvNovedad').value.trim()
    };

    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (respuesta && respuesta.estado === true) {
          mostrarToast(respuesta.mensaje || 'Novedad registrada correctamente.');
          limpiarFormularioNovedad();
          cargarHistorial(cedula);
        } else {
          mostrarToast(respuesta && respuesta.mensaje ? respuesta.mensaje : 'No fue posible registrar.', 'error');
        }
      })
      .withFailureHandler(function(error) {
        mostrarToast('Error registrando novedad.', 'error');
      })
      .registrarNovedad(tokenSesion, datos);
  }

  function limpiarFormularioNovedad() {
    document.getElementById('novedadNombre').value = '';
    document.getElementById('novedadDias').value = '';
    document.getElementById('fechaInicial').value = '';
    document.getElementById('fechaPresentacion').value = '';
    document.getElementById('descripcionNovedad').value = '';
    document.getElementById('observacionNovedad').value = '';
    document.getElementById('rvNovedad').value = '';

  function cargarTurno(filtro) {
    // Verificar permiso
    if (turnoPermitido && turnoPermitido !== 'TODOS' && filtro !== turnoPermitido) {
      mostrarToast('No tiene permiso para consultar este turno.', 'error');
      return;
    }

    const contenedor = document.getElementById('resultadoTurno');
    ultimoTurnoConsultado = filtro;
    ultimoResultadoturno = null;
    contenedor.innerHTML = '<div class="loading">🔄 Consultando ' + esc(filtro) + '...</div>';

    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (!respuesta || respuesta.estado !== true) {
          contenedor.innerHTML = '<div class="empty">' + esc(respuesta && respuesta.mensaje ? respuesta.mensaje : 'No se encontró información.') + '</div>';
          return;
        }
        ultimoResultadoturno = respuesta;
        renderTurno(respuesta);
      })
      .withFailureHandler(function(error) {
        contenedor.innerHTML = '<div class="alert alert-danger">Error consultando el turno.</div>';
      })
      .consultarPorTurno(tokenSesion, filtro);
  }

  function renderTurno(respuesta) {
    const contenedor = document.getElementById('resultadoTurno');
    const datos = respuesta.datos || {};
    let funcionarios = datos.funcionarios || respuesta.funcionarios || [];
    const filtro = datos.filtro || respuesta.filtro || ultimoTurnoConsultado || '';

    if (!funcionarios.length) {
      contenedor.innerHTML = '<div class="card"><div class="card-body"><div class="empty">No hay funcionarios registrados para ' + esc(filtro) + '.</div></div></div>';
      return;
    }

    // Categorías requeridas: OF, EJE, PT, PP, AXP, NO UNI (NIV eliminado)
    const categorias = ['OF', 'EJE', 'PT', 'PP', 'AXP', 'NO UNI'];
    let fuerzaDisponible = {};
    let fuerzaEfectiva = {};
    let totalDisponible = 0;
    let totalEfectiva = 0;

    categorias.forEach(cat => {
      fuerzaDisponible[cat] = 0;
      fuerzaEfectiva[cat] = 0;
    });

    funcionarios.forEach(f => {
      let nivelRaw = String(f.nivel || f.NIV || f.categoria || f.CATEGORIA || '').trim().toUpperCase();
      let gradoRaw = String(f.grado || f.GR || '').trim().toUpperCase();
      
      let catAsignada = 'NO UNI';
      if (nivelRaw && categorias.includes(nivelRaw)) {
        catAsignada = nivelRaw;
      } else {
        if (gradoRaw.includes('OF') || gradoRaw.includes('TENIENTE') || gradoRaw.includes('CAPITAN') || gradoRaw.includes('MAYOR') || gradoRaw.includes('CORONEL') || gradoRaw.includes('GENERAL')) {
          catAsignada = 'OF';
        } else if (gradoRaw.includes('PT') || gradoRaw.includes('PATRULLERO')) {
          catAsignada = 'PT';
        } else if (gradoRaw.includes('SI') || gradoRaw.includes('EJECUTIVO') || gradoRaw.includes('INTENDENTE') || gradoRaw.includes('COMISARIO')) {
          catAsignada = 'EJE';
        } else if (gradoRaw.includes('PP') || gradoRaw.includes('PATRULLERO DE POLICIA') || gradoRaw.includes('AUXILIAR')) {
          catAsignada = 'PP';
        } else if (gradoRaw.includes('AXP') || gradoRaw.includes('APOYO')) {
          catAsignada = 'AXP';
        } else if (gradoRaw.includes('NIV')) {
          catAsignada = 'NIV';
        }
      }

      fuerzaDisponible[catAsignada]++;
      totalDisponible++;

      const novedades = f.historialNovedades || [];
      if (novedades.length === 0) {
        fuerzaEfectiva[catAsignada]++;
        totalEfectiva++;
      }
    });

    let html = '<div class="card mb-3"><div class="card-header bg-white">📊 <strong>CONTEO DE FUERZA Y EFECTIVA - TURNO: ' + esc(filtro) + '</strong></div><div class="card-body">';
    html += '<div class="row g-2 mb-3">';
    
    categorias.forEach(cat => {
      let disp = fuerzaDisponible[cat];
      let efec = fuerzaEfectiva[cat];
      // Cambiar etiqueta EJE por "Nivel EJEC"
      let etiqueta = cat === 'EJE' ? 'Nivel EJEC' : cat;
      html += '<div class="col-6 col-md-3 col-lg">';
      html += '<div class="stat-card">';
      html += '<div class="stat-label">' + etiqueta + '</div>';
      html += '<div class="stat-number">' + efec + ' <small class="text-muted fs-6">/ ' + disp + '</small></div>';
      html += '<div class="text-muted" style="font-size: 11px;">Efectiva / Total</div>';
      html += '</div></div>';
    });

    html += '<div class="col-6 col-md-3 col-lg">';
    html += '<div class="stat-card" style="border-top-color: var(--dorado);">';
    html += '<div class="stat-label">En formacion</div>';
    html += '<div class="stat-number" style="color: var(--dorado);">' + totalEfectiva + ' <small class="text-muted fs-6">/ ' + totalDisponible + '</small></div>';
    html += '<div class="text-muted" style="font-size: 11px;">Total Efectiva / Total</div>';
    html += '</div></div>';

    html += '</div>';
    html += '</div></div>';

    html += '<div class="card"><div class="card-header"><div class="d-flex justify-content-between align-items-center"><span>📋 Detalle Funcionarios ' + esc(filtro) + '</span><div><button type="button" class="btn btn-sm btn-secondary me-1" onclick="window.print()">🖨 Imprimir</button><button type="button" class="btn btn-sm btn-pol" onclick="generarReporteDesdeTurno()">📄 Reporte</button></div></div></div><div class="card-body">';
    html += '<div class="table-wrapper"><table class="table table-bordered table-hover"><thead><tr><th>#</th><th>CÉDULA</th><th>GRADO</th><th>FUNCIONARIO</th><th>DEPENDENCIA</th><th>TURNO</th><th>NOVEDADES</th></tr></thead><tbody>';

    funcionarios.forEach(function(f, indice) {
      const novedades = f.historialNovedades || [];
      let novedadesHtml = novedades.length ? novedades.map(n => '<span class="badge-novedad">' + esc(n.NOVEDAD || '') + '</span>').join('') : '<span class="text-muted">S/N</span>';
      html += '<tr><td>' + (indice + 1) + '</td><td>' + esc(f.cedula || f.CEDULA || '') + '</td><td>' + esc(f.grado || f.GR || '') + '</td><td><strong>' + esc(f.funcionario || f.FUNCIONARIO || '') + '</strong></td><td>' + esc(f.dependencia || f.DEPENDENCIA || '') + '</td><td>' + esc(f.turno || f.TURNO || '') + '</td><td>' + novedadesHtml + '</td></tr>';
    });
    html += '</tbody></table></div></div></div>';
    contenedor.innerHTML = html;
  }

          contenedor.innerHTML = '<div class="alert alert-danger">No se pudo generar la previsualización.</div>';

  function imprimirReporte() {

    document.getElementById('filtroReporte').value = ultimoTurnoConsultado;

  // Convierte base64 en un Blob y dispara la descarga directa (sin usar Drive)
  function generarArchivoReporte(formato) {
    const filtro = document.getElementById('filtroReporte').value;
    if (!filtro) { mostrarToast('Seleccione un turno.', 'error'); return; }

    mostrarToast('Descargando ' + (formato === 'pdf' ? 'PDF' : 'Excel') + ' del turno ' + filtro + '...');
    descargarReporte_(formato, filtro);
  }

  // Consulta la ruta de descarga y muestra que responde el servidor.
// Util para distinguir "no desplegado" de "error al generar el archivo".
function probarDescarga() {
    const filtro = document.getElementById('filtroReporte').value || 'A';
    const caja = document.getElementById('ultimoArchivo');
    if (caja) {
      caja.className = 'alert alert-warning mt-3';
      caja.textContent = 'Probando descarga del turno ' + filtro + '...';
    }

    const url = urlReporte_('pdf', filtro);
    fetch(url, { redirect: 'follow' })
      .then(function(r) { return r.text().then(function(txt) { return { ok: r.ok, status: r.status, txt: txt }; }); })
      .then(function(res) {
        if (!caja) return;
        // Un PDF empieza con la firma %PDF
        if (res.txt.indexOf('%PDF') === 0) {
          caja.className = 'alert alert-success mt-3';
          caja.textContent = 'OK: el servidor devolvió un PDF válido (' + res.txt.length + ' bytes). ' +
            'Si no se descargó solo, use el enlace de arriba.';
          const enlace = document.createElement('a');
          enlace.href = url; enlace.target = '_blank'; enlace.rel = 'noopener';
          enlace.textContent = ' Abrir/descargar PDF manualmente';
          caja.appendChild(enlace);
        } else {
          caja.className = 'alert alert-danger mt-3';
          caja.textContent = 'El servidor NO devolvió un PDF. Respuesta: ' + res.txt.substring(0, 400);
        }
      })
      .catch(function(e) {
        if (!caja) return;
        caja.className = 'alert alert-danger mt-3';
        caja.textContent = 'Error de red al probar la descarga: ' + e.message;
      });
  }

  function cargarReportes() {
    const contenedor = document.getElementById('listaReportes');
    if (!contenedor) return;
    google.script.run
      .withSuccessHandler(function(respuesta) {
        if (!respuesta || respuesta.estado !== true) { contenedor.innerHTML = '<div class="empty">No hay reportes.</div>'; return; }
        const reportes = respuesta.datos || respuesta.reportes || [];
        if (!reportes.length) { contenedor.innerHTML = '<div class="empty">No hay reportes generados.</div>'; return; }
        let html = '<div class="table-wrapper"><table class="table table-bordered"><thead><tr><th>CONSECUTIVO</th><th>FECHA</th><th>TURNO</th><th>ACCIÓN</th></tr></thead><tbody>';
        reportes.forEach(r => {
          const turno = esc(r.TURNO || '');
          html += '<tr><td>' + esc(r.CONSECUTIVO) + '</td><td>' + esc(formatearValor(r.FECHA)) + '</td><td>' + turno + '</td>' +
            '<td><button type="button" class="btn btn-sm btn-pol" onclick="regenerarReporte(\'' + turno + '\')">📄 PDF</button> ' +
            '<button type="button" class="btn btn-sm btn-success" onclick="regenerarReporteExcel(\'' + turno + '\')">📊 Excel</button></td></tr>';
        });
        html += '</tbody></table></div>';
        contenedor.innerHTML = html;
      })
      .withFailureHandler(() => { contenedor.innerHTML = '<div class="alert alert-danger">Error cargando reportes.</div>'; })
      .listarReportes(tokenSesion, 100);
  }

  function regenerarReporte(turno) {
    document.getElementById('filtroReporte').value = turno;
    generarArchivoReporte('pdf');
  }

  function regenerarReporteExcel(turno) {
    document.getElementById('filtroReporte').value = turno;
    generarArchivoReporte('excel');
  }

  function cargarUsuarios() {
    const contenedor = document.getElementById('listaUsuarios');
    google.script.run

        if (!respuesta || respuesta.estado !== true) { contenedor.innerHTML = '<div class="alert alert-danger">Error cargando usuarios.</div>'; return; }
        const usuarios = respuesta.datos || respuesta.usuarios || [];
        let html = '<div class="table-wrapper"><table class="table table-bordered"><thead><tr><th>USUARIO</th><th>ROL</th><th>DEPENDENCIA</th><th>ESTADO</th></tr></thead><tbody>';
        usuarios.forEach(u => {
          html += '<tr><td>' + esc(u.USUARIO) + '</td><td>' + esc(u.ROL) + '</td><td>' + esc(u.DEPENDENCIA) + '</td><td>' + esc(u.ESTADO) + '</td></tr>';

        html += '</tbody></table></div>';
        contenedor.innerHTML = html;
      })
      .withFailureHandler(() => { contenedor.innerHTML = '<div class="alert alert-danger">Error cargando usuarios.</div>'; })

  function crearUsuario() {
    const usuario = document.getElementById('nuevoUsuario').value.trim();
    const clave = document.getElementById('nuevaClave').value;
    const rol = document.getElementById('nuevoRol').value;
    const dependencia = document.getElementById('nuevaDependencia').value.trim();
    if (!usuario || !clave || !rol || !dependencia) { mostrarToast('Complete todos los campos.', 'error'); return; }

    google.script.run
      .withSuccessHandler(res => {
        mostrarToast(res.mensaje || 'Usuario creado.');
        cargarUsuarios();
      })
      .withFailureHandler(() => mostrarToast('Error creando usuario.', 'error'))
      .crearUsuario(tokenSesion, usuario, clave, rol, dependencia);
  }

  function cambiarEstadoUsuario(usuario, nuevoEstado) {
    google.script.run
      .withSuccessHandler(() => { mostrarToast('Estado actualizado.'); cargarUsuarios(); })
      .withFailureHandler(() => mostrarToast('Error.', 'error'))
      .cambiarEstadoUsuario(tokenSesion, usuario, nuevoEstado);
  }

  function formatearValor(valor) {
    if (valor === null || valor === undefined || valor === '') return '';
    if (typeof valor === 'string') return valor;
    try {
      const fecha = new Date(valor);
      if (!isNaN(fecha.getTime())) {
        return String(fecha.getDate()).padStart(2,'0') + '/' + String(fecha.getMonth() + 1).padStart(2,'0') + '/' + fecha.getFullYear();
      }
    } catch(e) {}
    return String(valor);
  }
